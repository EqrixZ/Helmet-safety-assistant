<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set theme + language before first paint (no flash). Mirrors src/hooks/useTheme.tsx and src/i18n.
      ;(function () {
        var d = document.documentElement
        var theme, lang
        try { theme = localStorage.getItem('hsa-theme'); lang = localStorage.getItem('hsa-lang') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (lang !== 'th' && lang !== 'en') {
          lang = (navigator.language || '').toLowerCase().indexOf('th') === 0 ? 'th' : 'en'
        }
        d.setAttribute('data-theme', theme)
        d.setAttribute('lang', lang)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'/%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Helmet Safety Assistant — ระบบติดตามความปลอดภัยการสวมหมวกนิรภัยในไซต์ก่อสร้างด้วย AI" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f141f" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Helmet Safety Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
